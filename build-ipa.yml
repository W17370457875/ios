name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: App 显示名称
        default: WebShell
      bundle_id:
        description: Bundle Identifier
        default: com.example.webshell
      home_url:
        description: 首页地址（留空则用代码里的默认地址）
        default: ""
      mode:
        description: 签名方式
        type: choice
        options: [ adhoc, developer ]
        default: adhoc

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 构建（未签名 / Ad-hoc）
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'developer') }}
        env:
          APP_NAME: ${{ inputs.app_name || 'WebShell' }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.webshell' }}
          HOME_URL: ${{ inputs.home_url }}
          CODE_SIGN_IDENTITY: "-"
        run: bash scripts/build.sh

      - name: 导入开发者证书
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'developer' }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 构建并签名（开发者证书）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'developer' }}
        env:
          APP_NAME: ${{ inputs.app_name || 'WebShell' }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.webshell' }}
          HOME_URL: ${{ inputs.home_url }}
          CODE_SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          PROFILE: /tmp/app.mobileprovision
        run: bash scripts/build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name || 'WebShell' }}-ipa
          path: build/*.ipa
          retention-days: 30
